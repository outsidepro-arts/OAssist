# Gradle and Kotlin use their default daemons. Workers follow available processors.
# Machine-specific limits belong in GRADLE_USER_HOME/gradle.properties.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.console=plain

android.useAndroidX=true
android.nonTransitiveRClass=true
android.disallowKotlinSourceSets=false

kotlin.code.style=official
kotlin.incremental=true

# JDK: JAVA_HOME or java on PATH. Keep machine-specific paths out of this file.
# Android SDK: ANDROID_HOME or sdk.dir in gitignored local.properties.
