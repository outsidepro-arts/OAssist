# Без переиспользуемого демона: сборка идёт в клиентском JVM
org.gradle.daemon=false

# Без агента инструментации: иначе mismatch agent-статуса форкает single-use daemon
# (клиент gradlew запущен без -javaagent)
org.gradle.internal.instrumentation.agent=false

# Ограничить параллелизм воркеров, чтобы не плодить JVM
org.gradle.workers.max=1

# Kotlin-компилятор в процессе Gradle, без отдельного daemon
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.useFallbackStrategy=false

# JVM-аргументы сборки. ДОЛЖНЫ в точности совпадать с GRADLE_OPTS в tools/run-*.ps1:
# иначе Gradle форкает single-use daemon (docs: "If the JAVA_OPTS and GRADLE_OPTS
# match org.gradle.jvmargs, the Daemon will not be used at all").
# --add-modules=ALL-DEFAULT обязателен: java.exe этого JDK инжектирует его в каждый
# запуск, и без него daemonOpts клиента и сборки не совпадают.
# -Xms64m обязателен: gradlew.bat добавляет DEFAULT_JVM_OPTS="-Xmx64m" "-Xms64m".
org.gradle.jvmargs=-Xmx4g -Xms64m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError --add-modules=ALL-DEFAULT

org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.vfs.watch=false
org.gradle.console=plain
org.gradle.daemon.idletimeout=3600000
org.gradle.java.home=C\:/dev/jdk/jdk-21.0.10+7

android.useAndroidX=true
android.nonTransitiveRClass=true
android.disallowKotlinSourceSets=false

kotlin.code.style=official
kotlin.incremental=true

# Android SDK: c:\dev\android-sdk
# JDK: c:\dev\jdk\jdk-21.0.10+7 (см. AGENTS.md)
